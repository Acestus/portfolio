name: Browser acceptance
on: [pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet run --file SearchDemo.cs -- install
      - run: dotnet run --file SearchDemo.cs
