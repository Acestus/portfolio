# Illustrative workflow. Review the environment and identity before enabling.
name: Demo Azure login
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  identity:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
      - run: az account show --query user.type --output tsv
