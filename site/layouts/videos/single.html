{{ define "main" }}
<article class="page prose">
  <p><a href="{{ .CurrentSection.RelPermalink }}">All videos</a></p>
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <video controls playsinline preload="none"{{ with .Params.thumbnail }} poster="{{ . }}"{{ end }} width="960" height="540" style="max-width: 100%; height: auto;" aria-label="{{ .Title }}">
    {{ with .Params.av1 }}<source src="{{ . }}" type='video/webm; codecs="av01.0.08M.08, opus"'>{{ end }}
    {{ with .Params.h264 }}<source src="{{ . }}" type="video/mp4">{{ end }}
    {{ with .Params.h264 }}<a href="{{ . }}">Download the video</a>{{ end }}
  </video>
</article>
{{ end }}
