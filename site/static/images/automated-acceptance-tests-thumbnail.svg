    <rect x="760" y="245" width="390" height="92" rx="12" fill="#242947" stroke="#495477" stroke-width="2"/>
    <text x="790" y="301" fill="#f5f3ff" font-size="27">Search results appear</text>
    <path d="M955 354v38m0 0-12-12m12 12 12-12" fill="none" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="760" y="407" width="390" height="102" rx="12" fill="#22283e" stroke="#43866e" stroke-width="2"/>
    <circle cx="805" cy="458" r="17" fill="#31a77a"/>
    <path d="m797 458 6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
