<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title">
  <title id="title">Agent CLI vs. MCP: Choosing the Right Operator Interface</title>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#101629"/><stop offset="1" stop-color="#242b47"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#a9c8e6" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="76" y="112" fill="#87cffa" font-size="23" letter-spacing="4">ACESTUS / AGENT OPERATIONS</text>
    <text x="72" y="266" fill="#fff" font-size="76" letter-spacing="-3">AGENT CLI</text>
    <rect x="68" y="296" width="454" height="112" rx="12" fill="#b92739"/>
    <text x="91" y="375" fill="#fff" font-size="71" letter-spacing="-2">vs. MCP</text>
    <text x="77" y="493" fill="#d3e5f5" font-size="28">Choose tools. Show evidence. Verify.</text>
    <rect x="648" y="152" width="544" height="414" rx="24" fill="#12263a" stroke="#507898" stroke-width="2"/>
    <text x="694" y="215" fill="#8dcfff" font-size="20" letter-spacing="3">TWO OPERATOR INTERFACES</text>
    <rect x="694" y="247" width="194" height="110" rx="14" fill="#172f43" stroke="#54768d" stroke-width="2"/>
    <text x="722" y="291" fill="#fff" font-size="27">CLI</text>
    <text x="722" y="330" fill="#b6d2e5" font-size="20">direct commands</text>
    <rect x="940" y="247" width="206" height="110" rx="14" fill="#172f43" stroke="#54768d" stroke-width="2"/>
    <text x="970" y="291" fill="#fff" font-size="27">MCP TOOLS</text>
    <text x="970" y="330" fill="#b6d2e5" font-size="20">typed actions</text>
    <path d="M911 303h-12m12 0 10-10m-10 10 10 10M929 303h-12m12 0-10-10m10 10-10 10" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M719 389H1124" stroke="#3e5c74" stroke-width="2"/>
    <circle cx="746" cy="474" r="25" fill="#21624f"/>
    <path d="m735 474 8 8 15-18" fill="none" stroke="#84e0bd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="789" y="484" fill="#f5f9fd" font-size="27">Scoped action, verified</text>
  </g>
</svg>
