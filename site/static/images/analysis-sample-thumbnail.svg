<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title">
  <title id="title">Analysis sample: Investigating a GitHub sync outage</title>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#071423"/><stop offset="1" stop-color="#1c354c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#a9c8e6" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="76" y="112" fill="#87cffa" font-size="21" letter-spacing="3">ACESTUS / SYSTEMS INVESTIGATION</text>
    <text x="72" y="264" fill="#fff" font-size="72" letter-spacing="-2">REPOSITORY</text>
    <rect x="68" y="294" width="530" height="112" rx="12" fill="#b92739"/>
    <text x="91" y="372" fill="#fff" font-size="64" letter-spacing="-2">OUTAGE</text>
    <text x="77" y="488" fill="#d3e5f5" font-size="26">Trace the change. Restore service.</text>
    <rect x="650" y="152" width="562" height="414" rx="24" fill="#12263a" stroke="#507898" stroke-width="2"/>
    <text x="694" y="216" fill="#8dcfff" font-size="19" letter-spacing="3">EVIDENCE PATH</text>
    <rect x="700" y="250" width="470" height="54" rx="10" fill="#153a55"/><text x="735" y="285" fill="#fff" font-size="22">Scheduled repository sync</text><path d="M935 306v26" stroke="#8dcfff" stroke-width="4"/><path d="m926 326 9 10 9-10" fill="none" stroke="#8dcfff" stroke-width="4"/><rect x="700" y="338" width="470" height="54" rx="10" fill="#153a55"/><text x="735" y="373" fill="#fff" font-size="22">Stale DNS configuration</text><path d="M935 394v26" stroke="#b92739" stroke-width="4"/><path d="m926 414 9 10 9-10" fill="none" stroke="#b92739" stroke-width="4"/><rect x="700" y="426" width="470" height="54" rx="10" fill="#442638" stroke="#b92739" stroke-width="2"/><text x="735" y="461" fill="#fff" font-size="22">Site outage → restore from Git</text><path d="M700 515H1170" stroke="#3e5c74" stroke-width="2"/>
  </g>
</svg>
