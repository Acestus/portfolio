<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title">
  <title id="title">Who gets left out when we build with AI</title>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#071423"/><stop offset="1" stop-color="#1c354c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#a9c8e6" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="76" y="112" fill="#87cffa" font-size="21" letter-spacing="3">ACESTUS / HUMANE TECHNOLOGY</text>
    <text x="72" y="264" fill="#fff" font-size="72" letter-spacing="-2">WHO GETS LEFT</text>
    <rect x="68" y="294" width="530" height="112" rx="12" fill="#b92739"/>
    <text x="91" y="372" fill="#fff" font-size="64" letter-spacing="-2">OUT OF AI?</text>
    <text x="77" y="488" fill="#d3e5f5" font-size="26">Access belongs in design.</text>
    <rect x="650" y="152" width="562" height="414" rx="24" fill="#12263a" stroke="#507898" stroke-width="2"/>
    <text x="694" y="216" fill="#8dcfff" font-size="19" letter-spacing="3">ASK WHO CAN PARTICIPATE</text>
    <rect x="690" y="250" width="210" height="72" rx="12" fill="#172f43"/><text x="733" y="295" fill="#fff" font-size="22">Devices</text><rect x="950" y="250" width="210" height="72" rx="12" fill="#172f43"/><text x="1001" y="295" fill="#fff" font-size="22">Connectivity</text><rect x="690" y="350" width="210" height="72" rx="12" fill="#172f43"/><text x="750" y="395" fill="#fff" font-size="22">Compute</text><rect x="950" y="350" width="210" height="72" rx="12" fill="#172f43"/><text x="1002" y="395" fill="#fff" font-size="22">Affordability</text><path d="M795 322v44h145m115-44v44H940M795 422v-26M1055 422v-26" fill="none" stroke="#8dcfff" stroke-width="3"/><rect x="800" y="460" width="330" height="64" rx="12" fill="#1e5746"/><text x="845" y="501" fill="#fff" font-size="22">Design for broader access</text>
  </g>
</svg>
