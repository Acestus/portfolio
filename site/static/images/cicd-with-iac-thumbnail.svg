<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Bicep and GitHub Actions demo</title>
  <desc id="desc">A dark workflow illustration showing a code panel progressing through development, staging, and production.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071423"/><stop offset="1" stop-color="#14283c"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#162b40"/><stop offset="1" stop-color="#0c1928"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9db4cc" stroke-opacity=".08"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <circle cx="1080" cy="180" r="180" fill="#1375b9" opacity=".18" filter="url(#glow)"/>
  <circle cx="220" cy="650" r="170" fill="#df3842" opacity=".12" filter="url(#glow)"/>
  <text x="72" y="112" fill="#8bdcff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">ACESTUS  /  CLOUD DELIVERY</text>
  <text x="72" y="244" fill="#f5f8fc" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" letter-spacing="-2">BICEP +</text>
  <rect x="64" y="278" width="590" height="92" rx="12" fill="#d53b45"/>
  <text x="88" y="342" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="800" letter-spacing="-1">GITHUB ACTIONS</text>
  <text x="72" y="438" fill="#e3edf6" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600">Validate. Deploy. Verify.</text>
  <text x="72" y="490" fill="#91a9c1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">TRUNK-BASED  ·  AZURE  ·  FEDERATED IDENTITY</text>
  <g transform="translate(728 112)">
    <rect width="482" height="340" rx="20" fill="url(#panel)" stroke="#54708b" stroke-opacity=".65" stroke-width="2"/>
    <path d="M0 62H482" stroke="#54708b" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="30" cy="31" r="7" fill="#e95a62"/><circle cx="55" cy="31" r="7" fill="#f0bd61"/><circle cx="80" cy="31" r="7" fill="#53c78a"/>
    <text x="112" y="38" fill="#c7d6e5" font-family="Menlo, Consolas, monospace" font-size="17">main.bicep</text>
    <text x="32" y="116" fill="#85cfff" font-family="Menlo, Consolas, monospace" font-size="18">resource</text>
    <text x="133" y="116" fill="#f2f6fa" font-family="Menlo, Consolas, monospace" font-size="18">'site'</text>
    <text x="196" y="116" fill="#f2f6fa" font-family="Menlo, Consolas, monospace" font-size="18">'Microsoft.Web/staticSites@2023-12-01'</text>
    <text x="52" y="158" fill="#9db4cc" font-family="Menlo, Consolas, monospace" font-size="18">= {</text>
    <text x="76" y="200" fill="#f0bd61" font-family="Menlo, Consolas, monospace" font-size="18">name:</text>
    <text x="145" y="200" fill="#d9e7f4" font-family="Menlo, Consolas, monospace" font-size="18"> 'portfolio'</text>
    <text x="76" y="242" fill="#f0bd61" font-family="Menlo, Consolas, monospace" font-size="18">location:</text>
    <text x="184" y="242" fill="#d9e7f4" font-family="Menlo, Consolas, monospace" font-size="18"> resourceGroup().location</text>
    <text x="52" y="284" fill="#9db4cc" font-family="Menlo, Consolas, monospace" font-size="18">}</text>
    <text x="324" y="320" fill="#65d69a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">INFRASTRUCTURE AS CODE</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <path d="M820 554H1110" stroke="#5e7892" stroke-width="4"/>
    <circle cx="822" cy="554" r="8" fill="#65d69a"/><circle cx="966" cy="554" r="8" fill="#65d69a"/><circle cx="1110" cy="554" r="8" fill="#65d69a"/>
    <rect x="748" y="582" width="148" height="72" rx="14" fill="#12273a" stroke="#327e6a"/>
    <rect x="896" y="582" width="148" height="72" rx="14" fill="#12273a" stroke="#327e6a"/>
    <rect x="1044" y="582" width="148" height="72" rx="14" fill="#12273a" stroke="#327e6a"/>
    <text x="822" y="627" fill="#dfeaf4" font-size="22">DEV</text>
    <text x="970" y="627" fill="#dfeaf4" font-size="22">STG</text>
    <text x="1118" y="627" fill="#dfeaf4" font-size="22">PRD</text>
  </g>
  <text x="72" y="658" fill="#7e96ae" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2">PULL REQUEST → MAIN → THREE VERIFIED STAGES</text>
</svg>
