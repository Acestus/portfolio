<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title">
  <title id="title">Doing work that uses my abilities</title>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#071423"/><stop offset="1" stop-color="#1c354c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#a9c8e6" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="76" y="112" fill="#87cffa" font-size="21" letter-spacing="3">ACESTUS / MEANINGFUL WORK</text>
    <text x="72" y="264" fill="#fff" font-size="72" letter-spacing="-2">USE YOUR</text>
    <rect x="68" y="294" width="530" height="112" rx="12" fill="#b92739"/>
    <text x="91" y="372" fill="#fff" font-size="64" letter-spacing="-2">ABILITIES</text>
    <text x="77" y="488" fill="#d3e5f5" font-size="22">Improve the process, not just complete it.</text>
    <rect x="650" y="152" width="562" height="414" rx="24" fill="#12263a" stroke="#507898" stroke-width="2"/>
    <text x="694" y="216" fill="#8dcfff" font-size="19" letter-spacing="3">FROM ROUTINE TO IMPROVEMENT</text>
    <rect x="710" y="260" width="440" height="70" rx="12" fill="#172f43"/><text x="760" y="304" fill="#fff" font-size="23">Understand the process</text><path d="M930 330v35" stroke="#8dcfff" stroke-width="3"/><rect x="710" y="370" width="440" height="70" rx="12" fill="#442638" stroke="#b92739" stroke-width="2"/><text x="760" y="414" fill="#fff" font-size="23">Question what no longer helps</text><path d="M930 440v35" stroke="#74ddae" stroke-width="3"/><rect x="710" y="480" width="440" height="58" rx="12" fill="#1e5746"/><text x="760" y="517" fill="#fff" font-size="22">Improve the system</text>
  </g>
</svg>
