<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title">
  <title id="title">Making sense of information</title>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#071423"/><stop offset="1" stop-color="#1c354c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#a9c8e6" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="76" y="112" fill="#87cffa" font-size="21" letter-spacing="3">ACESTUS / EVIDENCE AND ANALYSIS</text>
    <text x="72" y="264" fill="#fff" font-size="72" letter-spacing="-2">MAKE SENSE</text>
    <rect x="68" y="294" width="530" height="112" rx="12" fill="#b92739"/>
    <text x="91" y="372" fill="#fff" font-size="64" letter-spacing="-2">OF INFORMATION</text>
    <text x="77" y="488" fill="#d3e5f5" font-size="26">Check context. Test evidence.</text>
    <rect x="650" y="152" width="562" height="414" rx="24" fill="#12263a" stroke="#507898" stroke-width="2"/>
    <text x="694" y="216" fill="#8dcfff" font-size="19" letter-spacing="3">FROM SOURCE TO CONCLUSION</text>
    <rect x="700" y="250" width="460" height="56" rx="10" fill="#153a55"/><text x="735" y="286" fill="#fff" font-size="22">1  Source</text><rect x="700" y="326" width="460" height="56" rx="10" fill="#153a55"/><text x="735" y="362" fill="#fff" font-size="22">2  Context and incentives</text><rect x="700" y="402" width="460" height="56" rx="10" fill="#153a55"/><text x="735" y="438" fill="#fff" font-size="22">3  Evidence</text><rect x="700" y="478" width="460" height="56" rx="10" fill="#1e5746"/><text x="735" y="514" fill="#fff" font-size="22">4  Supported conclusion</text>
  </g>
</svg>
