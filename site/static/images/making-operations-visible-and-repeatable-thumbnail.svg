<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title">
  <title id="title">Making operations visible and repeatable</title>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#071423"/><stop offset="1" stop-color="#1c354c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#a9c8e6" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#background)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="76" y="112" fill="#87cffa" font-size="21" letter-spacing="3">ACESTUS / PLATFORM OPERATIONS</text>
    <text x="72" y="264" fill="#fff" font-size="72" letter-spacing="-2">VISIBLE OPS</text>
    <rect x="68" y="294" width="530" height="112" rx="12" fill="#b92739"/>
    <text x="91" y="372" fill="#fff" font-size="64" letter-spacing="-2">REPEATABLE</text>
    <text x="77" y="488" fill="#d3e5f5" font-size="26">From procedure to reviewed code.</text>
    <rect x="650" y="152" width="562" height="414" rx="24" fill="#12263a" stroke="#507898" stroke-width="2"/>
    <text x="694" y="216" fill="#8dcfff" font-size="19" letter-spacing="3">A REPEATABLE PATH</text>
    <rect x="690" y="270" width="145" height="90" rx="12" fill="#153a55"/><text x="718" y="307" fill="#fff" font-size="19">Document</text><text x="728" y="336" fill="#b6d2e5" font-size="17">procedure</text><rect x="865" y="270" width="145" height="90" rx="12" fill="#153a55"/><text x="901" y="307" fill="#fff" font-size="19">Review</text><text x="891" y="336" fill="#b6d2e5" font-size="17">the change</text><rect x="1040" y="270" width="145" height="90" rx="12" fill="#153a55"/><text x="1081" y="307" fill="#fff" font-size="19">Test</text><text x="1065" y="336" fill="#b6d2e5" font-size="17">and repeat</text><path d="M835 315h30m145 0h30" stroke="#74ddae" stroke-width="4"/><path d="m855 305 10 10-10 10m165-10 10-10 10 10-10 10" fill="none" stroke="#74ddae" stroke-width="4"/><path d="M710 425H1160" stroke="#3e5c74" stroke-width="2"/><text x="820" y="478" fill="#d3e5f5" font-size="22">Visible to the whole team</text>
  </g>
</svg>
