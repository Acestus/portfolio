name: Test-Portfolio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: portfolio-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    name: Test-Portfolio
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.164.0'
          extended: true
      - name: Restore locked dependencies
        run: |
          python3 scripts/test_candidate_verification.py
          npm ci
          dotnet restore tests/Portfolio.Tests/Portfolio.Tests.csproj --locked-mode
          dotnet build tests/Portfolio.Tests/Portfolio.Tests.csproj --no-restore
          node tools/Portfolio.Build/bin/Debug/net10.0/.playwright/package/cli.js install --with-deps chromium
      - name: Build exact site and resume PDF
        run: dotnet run --project tools/Portfolio.Build --no-build -- build
      - name: Test generated output and browser behavior
        run: |
          dotnet tools/Portfolio.Build/bin/Debug/net10.0/Portfolio.Build.dll serve 1315 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:1315/ > /dev/null; then break; fi
            sleep 1
          done
          mkdir -p artifacts/evidence
          PORTFOLIO_ROOT="$PWD" PORTFOLIO_TEST_URL=http://127.0.0.1:1315 PORTFOLIO_EVIDENCE="$PWD/artifacts/evidence" dotnet test tests/Portfolio.Tests/Portfolio.Tests.csproj --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - name: Package the qualified bytes
        run: |
          tar -cf artifacts/site.tar -C public .
          sha256sum artifacts/site.tar > artifacts/site.tar.sha256
          cp public/release.json artifacts/release.json
          cp public/release-files.json artifacts/release-files.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-site
          path: |
            artifacts/site.tar
            artifacts/site.tar.sha256
            artifacts/release.json
            artifacts/release-files.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: portfolio-test-evidence
          path: |
            artifacts/test-results
            artifacts/evidence
          if-no-files-found: warn
          retention-days: 14
