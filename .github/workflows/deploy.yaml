name: Deploy-Portfolio
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful main Test-Portfolio run, independently verified before deployment
        type: string
        required: true
      site_sha256:
        description: SHA-256 of the exact independently verified site.tar
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: portfolio-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify trusted producer before obtaining delivery privileges
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > producer.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '.repository.full_name == $repo and .head_repository.full_name == $repo and .event == "push" and .head_branch == "main" and .path == ".github/workflows/Test-Portfolio.yaml" and .conclusion == "success"' producer.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portfolio-site
          path: retained
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - name: Check archive and exact file inventory
        env:
          EXPECTED_SITE_SHA256: ${{ inputs.site_sha256 }}
        run: python3 scripts/verify_candidate.py retained producer.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-portfolio
          path: |
            retained/site.tar
            retained/release.json
            producer.json
          retention-days: 90
          if-no-files-found: error
  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-portfolio
      - name: Extract the verified site
        run: |
          mkdir site
          tar -xf retained/site.tar -C site
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
      - name: Acquire ephemeral upload credential for the existing app
        id: credential
        run: |
          token=$(az staticwebapp secrets list --name swa-portfolio-dev-scus-001 --resource-group rg-portfolio-dev --query properties.apiKey -o tsv)
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.credential.outputs.token }}
          action: upload
          app_location: site
          skip_app_build: true
          production_branch: main
      - name: Record deployed artifact identity
        env:
          SITE_SHA256: ${{ inputs.site_sha256 }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          echo "Deployed source run $SOURCE_RUN_ID; exact archive SHA-256 $SITE_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "Independent post-deployment verification is required before claiming acceptance." >> "$GITHUB_STEP_SUMMARY"
