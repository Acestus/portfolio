name: 02 Publish-Development
'on':
  push:
    branches:
    - main
permissions:
  contents: read
  actions: read
concurrency:
  group: portfolio-automatic-release
  cancel-in-progress: false
jobs:
  commit-stage:
    permissions:
      contents: read
    uses: ./.github/workflows/_Qualify.yaml
    with:
      preview: false
  publish:
    needs: commit-stage
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_Deliver.yaml
    with:
      stage: development
      operation: publish
      source_run_id: ${{ github.run_id }}
      archive_sha256: ${{ needs.commit-stage.outputs.archive_sha256 }}
  staging:
    needs: [commit-stage, publish]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_Deliver.yaml
    with:
      stage: staging
      operation: promote
      source_run_id: ${{ github.run_id }}
      archive_sha256: ${{ needs.commit-stage.outputs.archive_sha256 }}
      evidence_run_id: ${{ github.run_id }}
  production:
    needs: [commit-stage, staging]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_Deliver.yaml
    with:
      stage: production
      operation: promote
      source_run_id: ${{ github.run_id }}
      archive_sha256: ${{ needs.commit-stage.outputs.archive_sha256 }}
      evidence_run_id: ${{ github.run_id }}
