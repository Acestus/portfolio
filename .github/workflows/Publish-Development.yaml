name: Publish-Development
'on':
  push:
    branches:
    - main
permissions:
  contents: read
  actions: read
jobs:
  commit-stage:
    permissions:
      contents: read
    uses: ./.github/workflows/_Qualify.yaml
    with:
      preview: false
  publish:
    needs: commit-stage
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_Deliver.yaml
    with:
      stage: development
      operation: publish
      source_run_id: ${{ github.run_id }}
      archive_sha256: ${{ needs.commit-stage.outputs.archive_sha256 }}
